<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nederland Nieuws Vandaag</title>
  <meta name="description" content="Het belangrijkste actuele Nederlandse nieuws van vandaag, gesorteerd op categorie.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23e2001a'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Georgia'>N</text></svg>">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">N</span>
        <div class="brand-text">
          <h1>Nederland Nieuws <span class="brand-day">Vandaag</span></h1>
          <p id="datum-regel">…</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="update-status" class="update-status">–</span>
        <button id="ververs-knop" class="btn-primary" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
          Verversen
        </button>
        <button id="thema-knop" class="btn-icon" type="button" aria-label="Wissel licht/donker" title="Wissel licht/donker">
          <svg id="icon-maantje" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
    <div class="progress" id="voortgang" hidden><div class="progress-bar" id="voortgang-balk"></div></div>
  </header>

  <section class="weer" id="weerbalk" hidden aria-label="Weersverwachting Kwadendamme"></section>

  <nav class="categorieën" id="tabbladen" aria-label="Nieuwscategorieën"></nav>

  <main class="hoofd">
    <section class="paneel" id="paneel-actief">
      <div class="paneel-kop">
        <h2 id="paneel-titel"></h2>
        <div class="paneel-kop-acties">
          <input type="search" id="zoeken" placeholder="Zoek in deze categorie…" autocomplete="off">
        </div>
      </div>
      <div id="inhoud" class="nieuws-lijst" aria-live="polite"></div>
    </section>

  </main>

  <footer class="voettekst">
    <p>Bron: <a href="https://www.nos.nl" target="_blank" rel="noopener">NOS</a> Nieuws (RSS) · Deze app toont alleen koppen en links, artikelen openen op nos.nl.</p>
  </footer>

  <script src="app.js?v=2"></script>
</body>
</html>
