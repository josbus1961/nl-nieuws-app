name: Haal nieuws op

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nieuws
  cancel-in-progress: false

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Feeds ophalen en nieuws.json bouwen
        run: node scripts/haal-nieuws.mjs

      - name: Commit en push bij wijzigingen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nieuws.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen"
          else
            git commit -m "Nieuws ververst: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
